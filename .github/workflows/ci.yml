name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · lint, migrate, test (PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rafta
          POSTGRES_PASSWORD: rafta
          POSTGRES_DB: rafta
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rafta" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://rafta:rafta@localhost:5432/rafta
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: api/requirements.lock
      - run: pip install -r requirements.lock pytest pytest-cov ruff
      - name: Lint
        run: |
          ruff check app tests
          ruff format --check app tests
      - name: Apply migrations
        run: alembic upgrade head
      - name: Migrations match the models
        run: alembic check
      - name: Tests
        run: pytest --cov=app --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: api/coverage.xml

  web:
    name: Web · lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build
